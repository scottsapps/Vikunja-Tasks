name: VikunjaWidget
options:
  bundleIdPrefix: net.angstreich
  deploymentTarget:
    macOS: "14.0"
    iOS: "17.0"
    watchOS: "10.0"

packages:
  TelemetryDeck:
    url: https://github.com/TelemetryDeck/SwiftSDK
    from: "2.0.0"

settings:
  SWIFT_VERSION: "5"
  base:
    # Signing is in Signing.xcconfig (git-ignored) so make gen never clobbers it.
    CODE_SIGN_STYLE: Automatic
    # Xcode recommended settings
    DEAD_CODE_STRIPPING: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    REGISTER_APP_GROUPS: YES
    STRING_CATALOG_GENERATE_SYMBOLS: YES
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
    CURRENT_PROJECT_VERSION: 79

configFiles:
  Debug: Signing.xcconfig
  Release: Signing.xcconfig

schemes:
  VikunjaWidgetApp:
    build:
      targets:
        VikunjaWidgetApp: all
        VikunjaWidgetExtension: all
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

  VikunjaWidgetAppIOS:
    build:
      targets:
        VikunjaWidgetAppIOS: all
        VikunjaWidgetExtensionIOS: all
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

  VikunjaWidgetWatch:
    build:
      targets:
        VikunjaWidgetWatch: all
        VikunjaWidgetWatchExtension: all
    run:
      config: Debug
    archive:
      config: Release

targets:
  # ── macOS ────────────────────────────────────────────────────────────────

  VikunjaWidgetApp:
    type: application
    platform: macOS
    sources:
      - path: VikunjaWidgetApp
        excludes:
          - InfoIOS.plist
      - path: VikunjaCore
    entitlements:
      path: VikunjaWidgetApp/VikunjaWidgetApp.entitlements
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: net.angstreich.VikunjaWidgetApp
      PRODUCT_NAME: Veyrn
      MARKETING_VERSION: "3.1.0"
      GENERATE_INFOPLIST_FILE: NO
      INFOPLIST_FILE: VikunjaWidgetApp/Info.plist
      MACOSX_DEPLOYMENT_TARGET: "14.0"
      ENABLE_HARDENED_RUNTIME: YES
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: VikunjaWidgetExtension
        embed: true
      - package: TelemetryDeck
      - sdk: CloudKit.framework

  VikunjaWidgetExtension:
    type: app-extension
    platform: macOS
    sources:
      - path: VikunjaWidgetExtension
      - path: VikunjaCore
    entitlements:
      path: VikunjaWidgetExtension/VikunjaWidgetExtension.entitlements
    info:
      path: VikunjaWidgetExtension/Info.plist
      properties:
        CFBundleDisplayName: Veyrn
        CFBundleName: Veyrn
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: net.angstreich.VikunjaWidgetApp.VikunjaWidgetExtension
      MARKETING_VERSION: "3.1.0"
      GENERATE_INFOPLIST_FILE: NO
      MACOSX_DEPLOYMENT_TARGET: "14.0"
      ENABLE_HARDENED_RUNTIME: YES
      SKIP_INSTALL: YES
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
      - sdk: AppIntents.framework

  # ── iOS ──────────────────────────────────────────────────────────────────

  VikunjaWidgetAppIOS:
    type: application
    platform: iOS
    sources:
      - path: VikunjaWidgetApp
        excludes:
          - Info.plist
      - path: VikunjaCore
    entitlements:
      path: VikunjaWidgetApp/VikunjaWidgetAppIOS.entitlements
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: net.angstreich.VikunjaWidgetApp
      PRODUCT_NAME: Veyrn
      MARKETING_VERSION: "3.1.0"
      GENERATE_INFOPLIST_FILE: NO
      INFOPLIST_FILE: VikunjaWidgetApp/InfoIOS.plist
      IPHONEOS_DEPLOYMENT_TARGET: "17.0"
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: VikunjaWidgetExtensionIOS
        embed: true
      - target: VikunjaWidgetWatch
        embed: true
      - package: TelemetryDeck
      - sdk: CloudKit.framework

  VikunjaWidgetExtensionIOS:
    type: app-extension
    platform: iOS
    sources:
      - path: VikunjaWidgetExtension
      - path: VikunjaCore
    entitlements:
      path: VikunjaWidgetExtension/VikunjaWidgetExtensionIOS.entitlements
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: net.angstreich.VikunjaWidgetApp.VikunjaWidgetExtension
      MARKETING_VERSION: "3.1.0"
      GENERATE_INFOPLIST_FILE: NO
      INFOPLIST_FILE: VikunjaWidgetExtension/Info.plist
      IPHONEOS_DEPLOYMENT_TARGET: "17.0"
      SKIP_INSTALL: YES
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
      - sdk: AppIntents.framework

  # ── watchOS ──────────────────────────────────────────────────────────────
  VikunjaWidgetWatch:
    type: application
    platform: watchOS
    sources:
      - path: VikunjaWidgetWatch
      - path: VikunjaCore
        includes:
          - VikunjaModels.swift
          - VikunjaAPI.swift
          - VikunjaConfig.swift
          - TokenStore.swift
          - QuickAddParser.swift
          - WidgetCache.swift
          - ColorUtils.swift
          - ErrorMessages.swift
          - DiagnosticLog.swift
    entitlements:
      path: VikunjaWidgetWatch/VikunjaWidgetWatch.entitlements
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: net.angstreich.VikunjaWidgetApp.watchkitapp
      PRODUCT_NAME: Veyrn
      MARKETING_VERSION: "3.1.0"
      GENERATE_INFOPLIST_FILE: NO
      INFOPLIST_FILE: VikunjaWidgetWatch/Info.plist
      WATCHOS_DEPLOYMENT_TARGET: "10.0"
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: VikunjaWidgetWatchExtension
        embed: true
      - package: TelemetryDeck

  VikunjaWidgetWatchExtension:
    type: app-extension
    platform: watchOS
    sources:
      - path: VikunjaWidgetWatchExtension
      - path: VikunjaCore
        includes:
          - VikunjaModels.swift
          - VikunjaConfig.swift
          - TokenStore.swift
          - WidgetCache.swift
          - ColorUtils.swift
          - VikunjaAPI.swift
          - ErrorMessages.swift
          - DiagnosticLog.swift
    entitlements:
      path: VikunjaWidgetWatchExtension/VikunjaWidgetWatchExtension.entitlements
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: net.angstreich.VikunjaWidgetApp.watchkitapp.widget
      MARKETING_VERSION: "3.1.0"
      GENERATE_INFOPLIST_FILE: NO
      INFOPLIST_FILE: VikunjaWidgetWatchExtension/Info.plist
      WATCHOS_DEPLOYMENT_TARGET: "10.0"
      SKIP_INSTALL: YES
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
