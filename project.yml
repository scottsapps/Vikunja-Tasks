name: VikunjaWidget
options:
  bundleIdPrefix: net.angstreich
  deploymentTarget:
    macOS: "14.0"
    iOS: "17.0"

settings:
  SWIFT_VERSION: "5"
  base:
    # Signing is in Signing.xcconfig (git-ignored) so make gen never clobbers it.
    CODE_SIGN_STYLE: Automatic
    # Xcode recommended settings
    DEAD_CODE_STRIPPING: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    REGISTER_APP_GROUPS: YES
    STRING_CATALOG_GENERATE_SYMBOLS: YES
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES

configFiles:
  Debug: Signing.xcconfig
  Release: Signing.xcconfig

schemes:
  VikunjaWidgetApp:
    build:
      targets:
        VikunjaWidgetApp: all
        VikunjaWidgetExtension: all
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

  VikunjaWidgetAppIOS:
    build:
      targets:
        VikunjaWidgetAppIOS: all
        VikunjaWidgetExtensionIOS: all
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

targets:
  # ── macOS ────────────────────────────────────────────────────────────────

  VikunjaWidgetApp:
    type: application
    platform: macOS
    sources:
      - path: VikunjaWidgetApp
        excludes:
          - InfoIOS.plist
      - path: VikunjaCore
    entitlements:
      path: VikunjaWidgetApp/VikunjaWidgetApp.entitlements
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: net.angstreich.VikunjaWidgetApp
      PRODUCT_NAME: Veyrn
      GENERATE_INFOPLIST_FILE: NO
      INFOPLIST_FILE: VikunjaWidgetApp/Info.plist
      MACOSX_DEPLOYMENT_TARGET: "14.0"
      CURRENT_PROJECT_VERSION: 2
      MARKETING_VERSION: "2.0"
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: VikunjaWidgetExtension
        embed: true

  VikunjaWidgetExtension:
    type: app-extension
    platform: macOS
    sources:
      - path: VikunjaWidgetExtension
      - path: VikunjaCore
    entitlements:
      path: VikunjaWidgetExtension/VikunjaWidgetExtension.entitlements
    info:
      path: VikunjaWidgetExtension/Info.plist
      properties:
        CFBundleDisplayName: Veyrn
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: net.angstreich.VikunjaWidgetApp.VikunjaWidgetExtension
      GENERATE_INFOPLIST_FILE: NO
      MACOSX_DEPLOYMENT_TARGET: "14.0"
      SKIP_INSTALL: YES
      CURRENT_PROJECT_VERSION: 2
      MARKETING_VERSION: "2.0"
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
      - sdk: AppIntents.framework

  # ── iOS ──────────────────────────────────────────────────────────────────

  VikunjaWidgetAppIOS:
    type: application
    platform: iOS
    sources:
      - path: VikunjaWidgetApp
        excludes:
          - Info.plist
      - path: VikunjaCore
    entitlements:
      path: VikunjaWidgetApp/VikunjaWidgetAppIOS.entitlements
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: net.angstreich.VikunjaWidgetApp
      PRODUCT_NAME: Veyrn
      GENERATE_INFOPLIST_FILE: NO
      INFOPLIST_FILE: VikunjaWidgetApp/InfoIOS.plist
      IPHONEOS_DEPLOYMENT_TARGET: "17.0"
      CURRENT_PROJECT_VERSION: 2
      MARKETING_VERSION: "2.0"
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: VikunjaWidgetExtensionIOS
        embed: true

  VikunjaWidgetExtensionIOS:
    type: app-extension
    platform: iOS
    sources:
      - path: VikunjaWidgetExtension
      - path: VikunjaCore
    entitlements:
      path: VikunjaWidgetExtension/VikunjaWidgetExtensionIOS.entitlements
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: net.angstreich.VikunjaWidgetApp.VikunjaWidgetExtension
      GENERATE_INFOPLIST_FILE: NO
      INFOPLIST_FILE: VikunjaWidgetExtension/Info.plist
      IPHONEOS_DEPLOYMENT_TARGET: "17.0"
      SKIP_INSTALL: YES
      CURRENT_PROJECT_VERSION: 2
      MARKETING_VERSION: "2.0"
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
      - sdk: AppIntents.framework
